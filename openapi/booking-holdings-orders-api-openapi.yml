  /orders/details/flights:
    post:
      summary: Booking.com Orders with Flight Details
      description: Use this endpoint to retrieve detailed information for one or more flight orders. - You can request car order details either by **order ID** or by **reservation ID**. - The response includes all relevant information for each order, such as booking and cancellation details, commission, pricing, and optional extras (for example, policies).   Results are sorted by `bookingDate` in descending order, with the most recently booked orders listed first. It returns structured order data, including pricing, itinerary segments with IATA airport codes, etc. </br></br>This endpoint is ideal for:</br></br> - Displaying flight booking details in traveller dashboards or confirmation pages.</br> - Generating post-booking communications and invoices. </br> - Performing reporting or reconciliation tasks that require accurate itinerary and pricing data.
      operationId: ordersDetailsFlights
      parameters:
      - in: header
        name: X-Affiliate-Id
        schema:
          type: integer
        required: true
        description: Include here your Affiliate identifier number
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              title: FlightsDetailsInput
              type: object
              properties:
                currency:
                  description: A three-letter code that uniquely identifies a monetary currency as defined by the ISO 4217 standard. The full list can be obtained by calling <a href="/demand/docs/open-api/demand-api/commonpayments/common/payments/currencies" target="_blank">common/payments/currencies</a>.
                  type: string
                  pattern: ^[A-Z]{3}$
                  example: EUR
              oneOf:
              - title: FlightsDetailsInputByOrders
                properties:
                  orders:
                    description: List of order IDs for which details should be returned. Mutually exclusive with 'reservations'.
                    type: array
                    items:
                      type: string
                      description: Flight order id for which details have to be returned.
                    maxItems: 100
                required:
                - orders
                example:
                  currency: EUR
                  orders:
                  - '1234567890123456'
                  - '9876543210987654'
              - title: FlightsDetailsInputByReservations
                properties:
                  reservations:
                    description: List of reservation IDs for which details should be returned. Mutually exclusive with 'orders'.
                    type: array
                    items:
                      type: string
                      description: Flight reservation id for which details have to be returned.
                    maxItems: 100
                required:
                - reservations
                example:
                  currency: EUR
                  reservations:
                  - '2321873123'
                  - '4666773123'
            examples:
              OrdersDetailsFlightsRequestExample:
                summary: Default ordersDetailsFlights request
                x-microcks-default: true
                value:
                  currency: EUR
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                title: OrdersDetailsFlightsOutput
                type: object
                properties:
                  data:
                    type: array
                    items:
                      title: FlightsOutput
                      type: object
                      properties:
                        id:
                          description: Order id
                          type: string
                        reservation:
                          description: This is the reservation id for the travel service in this order.
                          type: string
                        currency:
                          title: CurrencyOutput
                          type: object
                          properties:
                            booker_currency:
                              description: The currency of the booker.
                              type: string
                            order_currency:
                              description: The currency in which the order was created.
                              type: string
                        itineraries:
                          type: array
                          items:
                            title: ItineraryOutput
                            type: object
                            properties:
                              arrival:
                                description: Arrival itinerary.
                                title: ItineraryPoint
                                type: object
                                properties:
                                  airport:
                                    description: A three-letter code that uniquely identifies an airport as defined by the International Air Transport Association (IATA). The full list can be obtained by calling  [common/locations/airports](#/common/locations/airports).
                                    pattern: ^[A-Z]{3}$
                                    type: string
                                  date_time:
                                    description: Date time of the itinerary.
                                    type: string
                                    format: date-time
                              departure:
                                description: Departure itinerary.
                                title: ItineraryPoint
                                type: object
                                properties:
                                  airport:
                                    description: A three-letter code that uniquely identifies an airport as defined by the International Air Transport Association (IATA). The full list can be obtained by calling  [common/locations/airports](#/common/locations/airports).
                                    pattern: ^[A-Z]{3}$
                                    type: string
                                  date_time:
                                    description: Date time of the itinerary.
                                    type: string
                                    format: date-time
                        label:
                          description: Identifier associated with the order.
                          type: string
                        price:
                          title: PriceOutput
                          type: object
                          properties:
                            booker_currency:
                              description: The price in the currency of the booker
                              type: number
                              format: double
                            order_currency:
                              description: The price in the currency in which order was created
                              type: number
                              format: double
                        status:
                          type: string
                          enum:
                          - booked
                          - cancelled
                          - unknown
                  request_id:
                    description: Uniquely identifies the request. Please provide this identifier when contacting support.
                    type: string
              example:
                data:
                - id: ORDER_ID
                  reservation: RESERVATION_ID
                  currency:
                    booker: EUR
                    order: USD
                  itineraries:
                  - departure:
                      airport: CAI
                      date_time: '2024-03-01T07:00:00+00:00'
                    arrival:
