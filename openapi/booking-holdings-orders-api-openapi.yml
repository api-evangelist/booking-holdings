  /orders/modify:
    post:
      summary: Booking.com Modify an Order
      description: "Use this endpoint to modify certain aspects of an accommodation order, such as credit card details, checkin/checkout dates, and room configurations (guest allocation, guest names, and smoking preferences). \n  - See the [Orders modification guide](/demand/docs/orders-api/order-modify) for examples and best practices.\n"
      operationId: ordersModify
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: AccommodationModification
                type: object
                properties:
                  order:
                    type: string
                    description: Order ID to be modified
                  modification:
                    type: object
                    properties:
                      accommodation:
                        type: object
                        properties:
                          reservation:
                            type: integer
                            description: Reservation ID
                          change:
                            oneOf:
                            - title: DateChange
                              type: object
                              properties:
                                checkin:
                                  type: string
                                  format: date
                                  description: New checkin date
                                checkout:
                                  type: string
                                  format: date
                                  description: New checkout date
                              required:
                              - checkin
                              - checkout
                            - title: RoomChange
                              type: object
                              properties:
                                room_reservation:
                                  type: integer
                                  format: int64
                                  description: Room reservation ID
                                allocation:
                                  type: object
                                  properties:
                                    number_of_adults:
                                      type: integer
                                guests:
                                  description: Guest information for the room.
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                smoking_preference:
                                  type: string
                                  enum:
                                  - no_preference
                                  - non_smoking
                                  - smoking
                          type:
                            description: Type of the accommodation change
                            type: string
                            enum:
                            - dates
                            - room
                        required:
                        - reservation
                        - type
                        - change
                    required:
                    - accommodation
                required:
                - order
                - modification
              - title: PaymentModification
                type: object
                properties:
                  order:
                    type: string
                    description: Order ID to be modified
                  modification:
                    type: object
                    properties:
                      payment:
                        type: object
                        properties:
                          change:
                            type: object
                            properties:
                              cardholder:
                                type: string
                                description: Cardholder name
                              cvc:
                                type: string
                                description: A 3 or 4 digit Card Verification Code (CVC) associated with the used card
                              expiry_date:
                                type: string
                                format: YYYY-MM
                                description: Card expiry date
                              number:
                                type: string
                                description: Card number
                            required:
                            - cardholder
                            - cvc
                            - expiry_date
                            - number
                          type:
                            description: Type of the payment change
                            type: string
                            enum:
                            - card
                        required:
                        - type
                        - change
                    required:
                    - payment
                required:
                - order
                - modification
            examples:
              OrdersModifyRequestExample:
                summary: Default ordersModify request
                x-microcks-default: true
                value: string
      responses:
        '200':
          description: Successful modification
          content:
            application/json:
              schema:
                oneOf:
                - title: AccommodationModificationResponse
                  type: object
                  properties:
                    modification:
                      type: object
                      properties:
                        accommodation:
                          type: object
                          properties:
                            new_price:
                              description: New price to be paid after the modification
                              type: number
                              format: double
                            status:
                              description: Status for this modification request.
                              type: string
                              enum:
                              - successful
                              - failed
                - title: PaymentModificationResponse
                  type: object
                  properties:
                    modifications:
