aid: booking-holdings
name: Booking Holdings
description: >-
  Booking Holdings is the world's leading provider of online travel and related services, operating a portfolio of
  brands including Booking.com, Priceline, Agoda, KAYAK, OpenTable, Rentalcars.com, Rocketmiles, FareHarbor,
  HotelsCombined, Cheapflights, and Momondo. The company connects travelers with accommodations, flights, rental cars,
  restaurant reservations, and travel experiences worldwide.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
