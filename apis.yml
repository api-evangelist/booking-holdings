apis:
  - name: Booking.com Demand API
    description: >-
      The Booking.com Demand API enables approved Affiliate Partners to access Booking.com's travel inventory —
      accommodations, car rentals, and flights. A RESTful, RPC-style API (HTTPS POST, JSON) for searching inventory,
      retrieving details, checking availability, managing orders, and exchanging partner-guest messages. This is Booking
      Holdings' primary publicly documented developer API; restaurant inventory (OpenTable) and other brand APIs are
      partner-gated and not included here.
    humanURL: https://developers.booking.com/demand/docs
    baseURL: https://demandapi.booking.com/3.1
    tags:
      - Accommodations
      - Car Rentals
      - Travel
      - Orders
      - Affiliate
    properties:
      - type: OpenAPI
        url: openapi/booking-com-demand-api.yaml
      - type: Documentation
        url: https://developers.booking.com/demand/docs
      - type: Authentication
        url: https://developers.booking.com/demand/docs/getting-started
