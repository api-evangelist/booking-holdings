naftiko: 1.0.0-alpha2
info:
  label: Booking.com Demand API — Messages
  description: 'Messages surface of the Booking.com Demand API. 3 operations. Lead operation: Send a Message. Self-contained Naftiko capability covering one Booking.com business surface.'
  tags:
  - Booking.com
  - Demand API
  - Messages
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOOKING_DEMAND_API_TOKEN: BOOKING_DEMAND_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: demand-api-messages
    baseUri: https://demandapi.booking.com/3.1
    description: Booking.com Demand API — Messages business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.BOOKING_DEMAND_API_TOKEN}}'
    resources:
    - name: messages-send
      path: /messages/send
      operations:
      - name: messagesSend
        method: POST
        description: Booking.com Send a Message
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Send a Message
        - name: body
          in: body
          type: object
          required: true
          description: Request payload for Booking.com Send a Message.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messages-latest
      path: /messages/latest
      operations:
      - name: messagesLatest
        method: POST
        description: Booking.com Fetch Latest Messages
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Fetch Latest Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messages-latest-confirm
      path: /messages/latest/confirm
      operations:
      - name: messagesLatestConfirm
        method: POST
        description: Booking.com Confirm Message Receipt
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Confirm Message Receipt
        - name: body
          in: body
          type: object
          required: true
          description: Request payload for Booking.com Confirm Message Receipt.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: demand-api-messages-rest
    port: 8080
    description: REST adapter for Booking.com Demand API — Messages. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/messages/send
      name: messages-send
      description: REST surface for Booking.com Send a Message.
      operations:
      - method: POST
        name: messagesSend
        description: Booking.com Send a Message
        call: demand-api-messages.messagesSend
        with:
          null: rest.None
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/latest
      name: messages-latest
      description: REST surface for Booking.com Fetch Latest Messages.
      operations:
      - method: POST
        name: messagesLatest
        description: Booking.com Fetch Latest Messages
        call: demand-api-messages.messagesLatest
        with:
          null: rest.None
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/latest/confirm
      name: messages-latest-confirm
      description: REST surface for Booking.com Confirm Message Receipt.
      operations:
      - method: POST
        name: messagesLatestConfirm
        description: Booking.com Confirm Message Receipt
        call: demand-api-messages.messagesLatestConfirm
        with:
          null: rest.None
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: demand-api-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Booking.com Demand API — Messages. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: send-message
      description: Booking.com Send a Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: demand-api-messages.messagesSend
      with:
        null: tools.None
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: fetch-latest-messages
      description: Booking.com Fetch Latest Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: demand-api-messages.messagesLatest
      with:
        null: tools.None
      outputParameters:
      - type: object
        mapping: $.
    - name: confirm-message-receipt
      description: Booking.com Confirm Message Receipt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: demand-api-messages.messagesLatestConfirm
      with:
        null: tools.None
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
