naftiko: 1.0.0-alpha2
info:
  label: Booking.com Demand API — Conversations
  description: 'Conversations surface of the Booking.com Demand API. 1 operations. Lead operation: Retrieve a Conversation. Self-contained Naftiko capability covering one Booking.com business surface.'
  tags:
  - Booking.com
  - Demand API
  - Conversations
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOOKING_DEMAND_API_TOKEN: BOOKING_DEMAND_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: demand-api-conversations
    baseUri: https://demandapi.booking.com/3.1
    description: Booking.com Demand API — Conversations business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.BOOKING_DEMAND_API_TOKEN}}'
    resources:
    - name: messages-conversations
      path: /messages/conversations
      operations:
      - name: messagesConversations
        method: POST
        description: Booking.com Retrieve a Conversation
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Retrieve a Conversation
        - name: body
          in: body
          type: object
          required: true
          description: Request payload for Booking.com Retrieve a Conversation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: demand-api-conversations-rest
    port: 8080
    description: REST adapter for Booking.com Demand API — Conversations. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/messages/conversations
      name: messages-conversations
      description: REST surface for Booking.com Retrieve a Conversation.
      operations:
      - method: POST
        name: messagesConversations
        description: Booking.com Retrieve a Conversation
        call: demand-api-conversations.messagesConversations
        with:
          null: rest.None
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: demand-api-conversations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Booking.com Demand API — Conversations. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: retrieve-conversation
      description: Booking.com Retrieve a Conversation
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: demand-api-conversations.messagesConversations
      with:
        null: tools.None
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
