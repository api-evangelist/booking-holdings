    resources:
    - name: messages-attachments-upload
      path: /messages/attachments/upload
      operations:
      - name: messagesAttachmentsUpload
        method: POST
        description: Booking.com Upload an Attachment
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Upload an Attachment
        - name: body
          in: body
          type: object
          required: true
          description: Request payload for Booking.com Upload an Attachment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: messages-attachments-download
      path: /messages/attachments/download
      operations:
      - name: messagesAttachmentsDownload
        method: POST
        description: Booking.com Download a Message Attachment
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Download a Message Attachment
        - name: body
          in: body
          type: object
          required: false
          description: Request payload for Booking.com Download a Message Attachment.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
