      with:
        null: tools.None
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-attachment-metadata
      description: Booking.com Retrieve Attachment Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: demand-api-attachments.messagesAttachmentsMetadata
