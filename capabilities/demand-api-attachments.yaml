        description: Booking.com Retrieve Attachment Metadata
        inputParameters:
        - name: null
          in: null
          type: string
          required: false
          description: Booking.com Retrieve Attachment Metadata
        - name: body
          in: body
          type: object
          required: false
          description: Request payload for Booking.com Retrieve Attachment Metadata.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: demand-api-attachments-rest
    port: 8080
    description: REST adapter for Booking.com Demand API — Attachments. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/messages/attachments/upload
      name: messages-attachments-upload
      description: REST surface for Booking.com Upload an Attachment.
      operations:
      - method: POST
        name: messagesAttachmentsUpload
        description: Booking.com Upload an Attachment
        call: demand-api-attachments.messagesAttachmentsUpload
        with:
          null: rest.None
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/attachments/download
      name: messages-attachments-download
      description: REST surface for Booking.com Download a Message Attachment.
      operations:
      - method: POST
        name: messagesAttachmentsDownload
        description: Booking.com Download a Message Attachment
        call: demand-api-attachments.messagesAttachmentsDownload
        with:
          null: rest.None
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
