naftiko: 1.0.0-alpha2
info:
  label: Booking.com Demand API — Attachments
  description: 'Attachments surface of the Booking.com Demand API. 3 operations. Lead operation: Upload an Attachment. Self-contained Naftiko capability covering one Booking.com business surface.'
  tags:
  - Booking.com
  - Demand API
  - Attachments
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
