    port: 9090
    transport: http
    description: MCP adapter for Booking.com Demand API — Common Languages. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: retrieve-language-codes
      description: Booking.com Retrieve Language Codes
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: demand-api-common-languages.commonLanguages
      with:
        null: tools.None
      outputParameters:
      - type: object
        mapping: $.
