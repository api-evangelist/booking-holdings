  description: 'Common Languages surface of the Booking.com Demand API. 1 operations. Lead operation: Retrieve Language Codes. Self-contained Naftiko capability covering one Booking.com business surface.'
  tags:
  - Booking.com
  - Demand API
  - Common Languages
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    BOOKING_DEMAND_API_TOKEN: BOOKING_DEMAND_API_TOKEN
capability:
